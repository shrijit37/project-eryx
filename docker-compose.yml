# Project Eryx — LOCAL DEVELOPMENT compose.
#
# Production does NOT use this file: images are built ONLY in GitHub
# Actions, pushed to GHCR by SHA tag, and Dokploy runs them as five
# applications (eryx-api, eryx-ws, eryx-candles, eryx-marketdata, eryx-web)
# against the shared Postgres/Redis with Infisical vault-ref env.
# (fleet rule: no server builds, no local databases in prod.)
#
# Here, `db`/`redis` are dev-only conveniences (PG18/Redis 8 to mirror
# prod), and app services build locally for iteration. Copy .env.example
# to .env before `docker compose up --build`.
#
# Production topology (Dokploy applications):
#   eryx-api         ghcr.io/shrijit37/project-eryx-api:<sha>         PORT 8080
#     -> https://api.project-eryx.shrijit.tech        (GET /health)
#   eryx-ws          ghcr.io/shrijit37/project-eryx-ws:<sha>          WS_PORT 4040
#     -> wss://ws.project-eryx.shrijit.tech           (GET /health)
#   eryx-candles     ghcr.io/shrijit37/project-eryx-candles:<sha>     HEALTH_PORT 4100 (internal)
#   eryx-marketdata  ghcr.io/shrijit37/project-eryx-marketdata:<sha>  HEALTH_PORT 4200 (internal)
#   eryx-web         ghcr.io/shrijit37/project-eryx-web:<sha>         PORT 3008
#     -> https://project-eryx.shrijit.tech            (GET /health)

services:
  db:
    image: postgres:18-alpine
    container_name: eryx-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_eryx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_eryx"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eryx-network

  redis:
    image: redis:8-alpine
    container_name: eryx-redis-dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - eryx-network

  migrate:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
      args:
        SERVICE: api
        ENTRY: src/app.ts
    container_name: eryx-migrate-dev
    working_dir: /app/packages/db
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/project_eryx?schema=public
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eryx-network

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
      args:
        SERVICE: api
        ENTRY: src/app.ts
    container_name: eryx-api-dev
    working_dir: /app/apps/api
    command: ["bun", "src/app.ts"]
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/project_eryx?schema=public
      REDIS_HOST: redis
      AUTH_URL: ${AUTH_URL:-https://auth.shrijit.tech}
      FINNHUB_API: ${FINNHUB_API:-}
      TRIGGER_MS: ${TRIGGER_MS:-3000}
      RECONCILE_MS: ${RECONCILE_MS:-900000}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - eryx-network

  ws-gateway:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
      args:
        SERVICE: ws-gateway
        ENTRY: src/index.ts
    container_name: eryx-ws-dev
    working_dir: /app/apps/ws-gateway
    command: ["bun", "src/index.ts"]
    environment:
      WS_PORT: 4040
      REDIS_HOST: redis
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4040/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - eryx-network

  candle-worker:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
      args:
        SERVICE: candle-worker
        ENTRY: src/index.ts
    container_name: eryx-candles-dev
    working_dir: /app/apps/candle-worker
    command: ["bun", "src/index.ts"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/project_eryx?schema=public
      REDIS_HOST: redis
      HEALTH_PORT: 4100
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - eryx-network

  market-data-worker:
    build:
      context: .
      dockerfile: apps/Dockerfile.py
    container_name: eryx-worker-dev
    working_dir: /app/apps/market-data-worker
    command: ["python", "src/main.py"]
    environment:
      # asyncpg does not accept the ?schema=public query param Prisma adds
      DATABASE_URL: postgresql://postgres:postgres@db:5432/project_eryx
      REDIS_HOST: redis
      HEALTH_PORT: 4200
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/health')\" || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - eryx-network

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4040}
    container_name: eryx-web-dev
    restart: always
    depends_on:
      - api
      - ws-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3008/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - eryx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  eryx-network:
    driver: bridge
