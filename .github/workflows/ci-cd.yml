# Project Eryx pipeline: validate -> build 5 GHCR images -> scan -> migrate ->
# redeploy 5 Dokploy apps -> gate. Production images are built ONLY here
# (fleet rule: no server builds). All five services expose the uniform
# GET /health contract; the public gates (api, web) check status+version.
#
# Required GitHub config:
#   vars.INFISICAL_IDENTITY_ID / vars.INFISICAL_DOMAIN / vars.INFISICAL_PROJECT_SLUG (org)
#   vars.DOKPLOY_URL (org), secrets.DOKPLOY_API_KEY (repo)
#   secrets.GHCR_PULL_TOKEN (repo, long-lived read:packages — never GITHUB_TOKEN)
#   vars.DOKPLOY_API_ID / _WS_ID / _CANDLES_ID / _MARKETDATA_ID / _WEB_ID (repo)
#   vars.INFISCAL prefix: ERYX (ERYX_DATABASE_URL[_EXTERNAL] in Infisical prod)
#   vars.REDIS_HOST / vars.REDIS_PORT (repo; shared Redis internal endpoint,
#     not a secret — Dokploy apps reach it over the private network)
#   vars.API_URL = https://api.project-eryx.shrijit.tech
#   vars.WEB_URL = https://project-eryx.shrijit.tech
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eryx-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/project-eryx

jobs:
  validate:
    name: Validate - Typecheck - Tests - Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version pin: setup-bun reads packageManager (bun@1.4.x) so CI can
      # never drift behind the repo again (1.3.14-vs-1.4.0 incident).
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_eryx?schema=public

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Web build (canonical domains baked in)
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://api.project-eryx.shrijit.tech
          NEXT_PUBLIC_WS_URL: wss://ws.project-eryx.shrijit.tech

      - name: Validate Docker Compose (dev file)
        run: docker compose config -q

  build:
    name: Build + push images
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/Dockerfile.bun
            build_args: SERVICE=api
            build_args2: ENTRY=src/app.ts
          - service: ws
            dockerfile: apps/Dockerfile.bun
            build_args: SERVICE=ws-gateway
            build_args2: ENTRY=src/index.ts
          - service: candles
            dockerfile: apps/Dockerfile.bun
            build_args: SERVICE=candle-worker
            build_args2: ENTRY=src/index.ts
          - service: marketdata
            dockerfile: apps/Dockerfile.py
            build_args: ""
            build_args2: ""
          - service: web
            dockerfile: apps/Dockerfile.web
            build_args: NEXT_PUBLIC_API_URL=https://api.project-eryx.shrijit.tech
            build_args2: NEXT_PUBLIC_WS_URL=wss://ws.project-eryx.shrijit.tech
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push ${{ matrix.service }} (amd64+arm64, SHA tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.build_args2 }}
          # Per-image GHA scope: multi-image jobs sharing one scope poison
          # each other; per-image scopes cut rebuilds from 10+ min to ~2 min.
          cache-from: type=gha,scope=eryx-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=eryx-${{ matrix.service }}
          tags: ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}

  scan:
    name: Scan images
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        service: [api, ws, candles, marketdata, web]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL

  deploy-prod:
    name: Migrate + redeploy + gate
    if: github.ref == 'refs/heads/main'
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Fetch database URL from Infisical (OIDC)
        uses: infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-name: ERYX_DATABASE_URL_EXTERNAL
      - name: Install dependencies (prisma CLI for migrations)
        run: bun install --frozen-lockfile
      - name: Run migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.ERYX_DATABASE_URL_EXTERNAL }}
        # A failed migration must NOT abort the job: that skips the redeploy
        # and leaves prod on old images. Warn loudly; the health gate below
        # is the real gate. (asyncpg note: strip ?schema= for non-Prisma use.)
        run: bunx prisma migrate deploy || echo "::warning::migrate failed on ${{ github.sha }} - deploying anyway"
      # Re-assert every app's env before redeploy (ref-based): Dokploy blanks
      # the editable env after a deploy consumes vault refs. Static ports are
      # included because saveEnvironment REPLACES the whole env, and the
      # shared-Redis host/port travel as plain repo vars (not secrets).
      - name: Re-assert Dokploy envs (ref-based, consumed on deploy)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          APP_IDS: ${{ vars.DOKPLOY_API_ID }} ${{ vars.DOKPLOY_WS_ID }} ${{ vars.DOKPLOY_CANDLES_ID }} ${{ vars.DOKPLOY_MARKETDATA_ID }} ${{ vars.DOKPLOY_WEB_ID }}
          APP_NAMES: api ws candles marketdata web
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          DOL='$'
          i=0
          for name in $APP_NAMES; do
            i=$((i+1)); id=$(echo "$APP_IDS" | cut -d' ' -f"$i")
            {
              echo "DATABASE_URL=${DOL}{{vault.infisical-prod.ERYX_DATABASE_URL}}"
              echo "REDIS_HOST=$REDIS_HOST"
              echo "REDIS_PORT=$REDIS_PORT"
              echo "APP_VERSION=$APP_VERSION"
              case "$name" in
                api) echo "PORT=8080" ;;
                ws) echo "WS_PORT=4040" ;;
                candles) echo "HEALTH_PORT=4100" ;;
                marketdata) echo "HEALTH_PORT=4200" ;;
                web) echo "PORT=3008" ;;
              esac
            } > /tmp/dokploy-$name.env
            python3 -c 'import json,os,sys; name=sys.argv[1]; print(json.dumps({"applicationId":sys.argv[2],"env":open(f"/tmp/dokploy-{name}.env").read(),"buildArgs":None,"buildSecrets":None,"createEnvFile":True}))' "$name" "$id" \
              | curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
                -H 'Content-Type: application/json' -d @- \
                "$DOKPLOY_URL/api/application.saveEnvironment" >/dev/null
            echo "env re-asserted for $name"
          done
      - name: Point Dokploy apps at SHA images and redeploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_IDS: ${{ vars.DOKPLOY_API_ID }} ${{ vars.DOKPLOY_WS_ID }} ${{ vars.DOKPLOY_CANDLES_ID }} ${{ vars.DOKPLOY_MARKETDATA_ID }} ${{ vars.DOKPLOY_WEB_ID }}
          APP_NAMES: api ws candles marketdata web
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          i=0
          for name in $APP_NAMES; do
            i=$((i+1)); id=$(echo "$APP_IDS" | cut -d' ' -f"$i")
            img="$IMAGE_BASE-$name:$SHA"
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"applicationId\":\"$id\",\"dockerImage\":\"$img\",\"username\":\"${{ github.actor }}\",\"password\":\"$GHCR_TOKEN\",\"registryUrl\":\"ghcr.io\"}" \
              "$DOKPLOY_URL/api/application.saveDockerProvider" >/dev/null
            curl -fsS -X POST -H "x-api-key: $DOKPLOY_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"applicationId\":\"$id\"}" \
              "$DOKPLOY_URL/api/application.redeploy" >/dev/null
            echo "redeploy triggered: $img"
          done
      - name: Gate public services on uniform /health
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        # Converged = HTTP 200 AND "status":"ok" AND version == deployed SHA.
        run: |
          set -euo pipefail
          for base in "$API_URL" "$WEB_URL"; do
            ok=0
            for i in $(seq 1 30); do
              body=$(curl -s --max-time 10 "$base/health" || echo '')
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"version\":\"$EXPECTED_VERSION\""; then
                echo "$base converged after $i attempt(s)"; ok=1; break
              fi
              echo "attempt $i/30: $base/health not converged"
              sleep 6
            done
            [ "$ok" = 1 ] || { echo "::error::$base/health never converged"; exit 1; }
          done
