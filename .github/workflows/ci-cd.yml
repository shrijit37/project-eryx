name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eryx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_eryx?schema=public

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://api.eryx.triptribe.info
          NEXT_PUBLIC_WS_URL: https://api.eryx.triptribe.info

      - name: Validate Docker Compose
        run: docker compose config -q