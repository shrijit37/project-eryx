name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eryx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: bunx prisma generate
        env:
          # prisma.config.ts resolves the datasource URL via env(); the
          # generator never connects, but the variable must be present.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_eryx?schema=public

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://api.eryx.triptribe.info
          NEXT_PUBLIC_WS_URL: https://api.eryx.triptribe.info

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run remote deploy
        uses: shrijit37/server-deploy/.github/actions/deploy-server@main
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
          ssh-host: ${{ secrets.SERVER_HOST }}
          ssh-user: ${{ secrets.SERVER_USER }}
          command: |
            set -e
            cd /home/ubuntu/projects/eryx
            bash scripts/deploy-remote.sh