# Project Eryx — production stack.
#
# App services use `network_mode: host` because the api and workers reference
# the databases via `localhost` (the python worker hardcodes it). With host
# networking the containers reach the host loopback, where db/redis are
# published. nginx on the host proxies to the app ports (8080 / 4040 / 3008).
services:
  db:
    image: postgres:16-alpine
    container_name: project_eryx_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project_eryx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_eryx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project_eryx_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
    container_name: eryx-api
    network_mode: host
    working_dir: /app/apps/api
    command: ["bun", "src/app.ts"]
    env_file: .env
    restart: always
    depends_on:
      - db
      - redis

  ws-gateway:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
    container_name: eryx-ws
    network_mode: host
    working_dir: /app/apps/ws-gateway
    command: ["bun", "src/index.ts"]
    env_file: .env
    restart: always
    depends_on:
      - db
      - redis

  candle-worker:
    build:
      context: .
      dockerfile: apps/Dockerfile.bun
    container_name: eryx-candles
    network_mode: host
    working_dir: /app/apps/candle-worker
    command: ["bun", "src/index.ts"]
    env_file: .env
    restart: always
    depends_on:
      - db
      - redis

  market-data-worker:
    build:
      context: .
      dockerfile: apps/Dockerfile.py
    container_name: eryx-worker
    network_mode: host
    working_dir: /app/apps/market-data-worker
    command: ["python", "src/main.py"]
    restart: always
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile.web
    container_name: eryx-web
    network_mode: host
    restart: always
    depends_on:
      - api
      - ws-gateway

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
